<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" viewBox="0 0 1024 260" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 38px; fill: #0f172a; letter-spacing: -0.5px; }
      .role { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 18px; fill: #1d4ed8; letter-spacing: 0.2px; }
      .desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 14.5px; fill: #334155; }
      .tag { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 11px; fill: #1e3a8a; letter-spacing: 1.2px; text-transform: uppercase; }
      .pill-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #1e40af; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Image -->
  <image href="./header-bg.png" x="0" y="0" width="1024" height="260" preserveAspectRatio="xMidYMid slice" />

  <!-- Translucent Card Overlay for Contrast -->
  <rect x="36" y="28" width="952" height="204" rx="12" fill="#ffffff" fill-opacity="0.84" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="1" />

  <!-- Top Badge -->
  <rect x="64" y="50" width="270" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="76" y="66" class="tag">ENTERPRISE ENGINEERING &amp; R&amp;D</text>

  <!-- Name -->
  <text x="64" y="112" class="title">Mathiyazhagan T</text>

  <!-- Role -->
  <text x="64" y="142" class="role">Software Developer  |  AI Engineer  |  Full Stack Developer  |  R&amp;D</text>

  <!-- Tagline -->
  <text x="64" y="170" class="desc">Building production-grade AI systems, intelligent automation, modern web applications, and developer tools.</text>

  <!-- Competency Chips -->
  <g transform="translate(64, 188)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="16" class="pill-text">AI Systems &amp; RAG</text>

    <rect x="138" y="0" width="155" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="150" y="16" class="pill-text">Full Stack Architecture</text>

    <rect x="301" y="0" width="145" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="313" y="16" class="pill-text">LLM Orchestration</text>

    <rect x="454" y="0" width="150" height="24" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="466" y="16" class="pill-text">Cloud &amp; Automation</text>
  </g>
</svg>